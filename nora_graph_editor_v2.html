<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>NORA Graph Database - Editor v2</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; background-color: #1e1e1e; color: #d4d4d4; }
        
        /* エディタパネル */
        #editor-panel { width: 380px; background-color: #252526; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.5); overflow-y: auto; z-index: 10; display: flex; flex-direction: column; }
        h2, h3 { color: #ffffff; margin-top: 0; font-weight: normal; font-size: 1.1em; }
        .form-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 3px; font-size: 0.85em; color: #cccccc; }
        input[type="text"], select { width: 100%; padding: 6px; box-sizing: border-box; background-color: #3c3c3c; border: 1px solid #555; color: white; border-radius: 4px; }
        button { width: 100%; padding: 8px; background-color: #0e639c; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 10px; font-size: 0.9em; }
        button:hover { background-color: #1177bb; }
        button.danger { background-color: #c0392b; margin-top: 5px; }
        button.danger:hover { background-color: #e74c3c; }
        hr { border: 0; border-top: 1px solid #444; margin: 15px 0; }
        
        /* リストパネル */
        #list-container { flex-grow: 1; overflow-y: auto; background-color: #1e1e1e; padding: 10px; border-radius: 4px; border: 1px solid #444; margin-top: 5px; }
        .list-item { font-size: 0.85em; padding: 5px; cursor: pointer; border-bottom: 1px solid #333; }
        .list-item:hover { background-color: #37373d; color: #61afef; }
        
        /* ビュアーパネル */
        #viewer-panel { flex-grow: 1; position: relative; }
        #mynetwork { width: 100%; height: 100%; }
        #info-box { position: absolute; top: 20px; right: 20px; background-color: rgba(37, 37, 38, 0.9); padding: 15px; border-radius: 5px; border: 1px solid #555; min-width: 200px; display: none; }
    </style>
</head>
<body>

    <div id="editor-panel">
        <h2 style="font-size: 1.3em;">🛠️ NORA Graph Editor v2</h2>
        
        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <h3>ノード編集</h3>
                <div class="form-group"><label>ID:</label><input type="text" id="nodeId"></div>
                <div class="form-group"><label>名前:</label><input type="text" id="nodeLabel"></div>
                <div class="form-group">
                    <label>タイプ:</label>
                    <select id="nodeGroup">
                        <option value="Person">Person（人）</option>
                        <option value="Farm">Farm（農地）</option>
                        <option value="Project">Project（プロジェクト）</option>
                    </select>
                </div>
                <button onclick="addNode()">保存 (追加/更新)</button>
            </div>
            
            <div style="flex: 1;">
                <h3>エッジ編集</h3>
                <div class="form-group"><label>From (元):</label><input type="text" id="edgeFrom"></div>
                <div class="form-group"><label>To (先):</label><input type="text" id="edgeTo"></div>
                <div class="form-group"><label>関係性:</label><input type="text" id="edgeLabel"></div>
                <button onclick="addEdge()">保存 (追加/更新)</button>
            </div>
        </div>
        <button class="danger" onclick="deleteSelected()">🗑️ グラフ上の選択項目を削除</button>

        <hr>

        <h3>📋 データ一覧＆検索</h3>
        <input type="text" id="searchInput" placeholder="IDや名前、関係性でフィルタ..." onkeyup="updateList()">
        
        <div id="list-container">
            <div style="color: #61afef; font-weight: bold; font-size: 0.9em; margin-bottom: 5px;">【Nodes】</div>
            <div id="node-list"></div>
            <div style="color: #98c379; font-weight: bold; font-size: 0.9em; margin: 15px 0 5px 0;">【Edges】</div>
            <div id="edge-list"></div>
        </div>
    </div>

    <div id="viewer-panel">
        <div id="mynetwork"></div>
        <div id="info-box">
            <h3 style="margin-top:0; font-size: 1.1em;">📋 選択情報</h3>
            <div id="info-content"></div>
        </div>
    </div>

    <script type="text/javascript">
        // --- 初期データ ---
        var nodes = new vis.DataSet([
            { id: 'p1', label: '上野', group: 'Person' },
            { id: 'p2', label: '本永', group: 'Person' },
            { id: 'f1', label: '明日を農園', group: 'Farm' }
        ]);
        var edges = new vis.DataSet([
            { id: 'e1', from: 'p1', to: 'f1', label: '管理する' },
            { id: 'e2', from: 'p2', to: 'f1', label: '技術支援する' }
        ]);

        // --- ネットワーク設定 ---
        var container = document.getElementById('mynetwork');
        var data = { nodes: nodes, edges: edges };
        var options = {
            nodes: { shape: 'dot', size: 20, font: { color: '#ffffff', size: 14 } },
            edges: { font: { color: '#cccccc', align: 'middle', size: 11 }, arrows: 'to', width: 2, smooth: { type: 'continuous' } },
            groups: {
                Person: { color: { background: '#0e639c', border: '#1177bb' } },
                Farm: { color: { background: '#2ecc71', border: '#27ae60' } },
                Project: { color: { background: '#e67e22', border: '#d35400' } }
            },
            interaction: { hover: true },
            physics: { barnesHut: { gravitationalConstant: -4000 } }
        };
        var network = new vis.Network(container, data, options);

        // --- ① 選択アイテムのフォーム連動機能 ---
        network.on("select", function (params) {
            var infoBox = document.getElementById('info-box');
            var infoContent = document.getElementById('info-content');
            
            if (params.nodes.length > 0) {
                // ノード選択時：フォームに値を自動セット
                var node = nodes.get(params.nodes[0]);
                document.getElementById('nodeId').value = node.id;
                document.getElementById('nodeLabel').value = node.label;
                document.getElementById('nodeGroup').value = node.group;
                
                infoContent.innerHTML = `<strong>ID:</strong> ${node.id}<br><strong>名前:</strong> ${node.label}<br><strong>タイプ:</strong> ${node.group}`;
                infoBox.style.display = 'block';
            } else if (params.edges.length > 0) {
                // エッジ選択時：フォームに値を自動セット
                var edge = edges.get(params.edges[0]);
                document.getElementById('edgeFrom').value = edge.from;
                document.getElementById('edgeTo').value = edge.to;
                document.getElementById('edgeLabel').value = edge.label;
                
                infoContent.innerHTML = `<strong>元:</strong> ${edge.from}<br><strong>先:</strong> ${edge.to}<br><strong>関係:</strong> ${edge.label}`;
                infoBox.style.display = 'block';
            } else {
                infoBox.style.display = 'none';
            }
        });

        // --- ② リアルタイム一覧＆フィルタ機能 ---
        function updateList() {
            var query = document.getElementById('searchInput').value.toLowerCase();
            
            var nList = document.getElementById('node-list');
            nList.innerHTML = '';
            nodes.get().forEach(function(n) {
                if(n.label.toLowerCase().includes(query) || n.id.toLowerCase().includes(query)) {
                    var div = document.createElement('div');
                    div.className = 'list-item';
                    div.innerHTML = `ID: ${n.id} | ${n.label} [${n.group}]`;
                    // リストクリックでグラフ上のノードを選択＆フォーカス
                    div.onclick = function() { 
                        network.selectNodes([n.id]); 
                        network.focus(n.id, {scale: 1.2, animation: true});
                        // フォームにも反映
                        document.getElementById('nodeId').value = n.id;
                        document.getElementById('nodeLabel').value = n.label;
                        document.getElementById('nodeGroup').value = n.group;
                    };
                    nList.appendChild(div);
                }
            });

            var eList = document.getElementById('edge-list');
            eList.innerHTML = '';
            edges.get().forEach(function(e) {
                if(e.label.toLowerCase().includes(query) || e.from.toLowerCase().includes(query) || e.to.toLowerCase().includes(query)) {
                    var div = document.createElement('div');
                    div.className = 'list-item';
                    div.innerHTML = `${e.from} ➔ ${e.to} [${e.label}]`;
                    div.onclick = function() { 
                        network.selectEdges([e.id]); 
                    };
                    eList.appendChild(div);
                }
            });
        }

        // データが変更されたらリストを自動更新
        nodes.on('*', updateList);
        edges.on('*', updateList);
        updateList(); // 初期描画

        // --- 編集ロジック（追加・更新・削除） ---
        function addNode() {
            var id = document.getElementById('nodeId').value;
            var label = document.getElementById('nodeLabel').value;
            var group = document.getElementById('nodeGroup').value;
            if (!id || !label) return;
            // vis.jsの仕様により、既存IDがあれば「更新」、無ければ「新規追加」になります
            nodes.update({ id: id, label: label, group: group });
        }

        function addEdge() {
            var from = document.getElementById('edgeFrom').value;
            var to = document.getElementById('edgeTo').value;
            var label = document.getElementById('edgeLabel').value;
            if (!from || !to || !label) return;
            var edgeId = from + '-' + to + '-' + label; // 簡易的なユニークID
            edges.update({ id: edgeId, from: from, to: to, label: label });
        }

        function deleteSelected() {
            var selectedNodes = network.getSelectedNodes();
            var selectedEdges = network.getSelectedEdges();
            if (selectedNodes.length > 0) nodes.remove(selectedNodes);
            if (selectedEdges.length > 0) edges.remove(selectedEdges);
            document.getElementById('info-box').style.display = 'none';
        }
    </script>
</body>
</html>
